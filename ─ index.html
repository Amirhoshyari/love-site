```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>یه سوال ازت دارم ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
        }

        .container {
            width: 90%;
            max-width: 500px;
            min-height: 520px;
            padding: 35px 25px;
            background: rgba(255,255,255,0.95);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 80px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        h1 {
            color: #ff3d6e;
            font-size: 28px;
            margin-bottom: 20px;
        }

        #question {
            color: #333;
            font-size: 23px;
            line-height: 1.8;
            min-height: 90px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            min-height: 180px;
        }

        button {
            border: none;
            border-radius: 50px;
            padding: 15px 30px;
            font-size: 19px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        #yesBtn {
            background: #ff3d6e;
            color: white;
            box-shadow: 0 8px 20px rgba(255,61,110,0.35);
        }

        #yesBtn:hover {
            transform: scale(1.05);
        }

        #noBtn {
            background: #eee;
            color: #555;
            position: relative;
        }

        #message {
            margin-top: 25px;
            color: #ff3d6e;
            font-size: 18px;
            min-height: 30px;
            font-weight: bold;
        }

        .final {
            display: none;
        }

        .final h1 {
            font-size: 34px;
        }

        .final p {
            font-size: 21px;
            line-height: 2;
            color: #444;
        }

        .final-heart {
            font-size: 100px;
            animation: heartbeat 1s infinite;
        }

        .floating-heart {
            position: fixed;
            bottom: -50px;
            font-size: 25px;
            animation: floatUp linear forwards;
            opacity: 0.8;
            z-index: 1;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }

            to {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 18px;
            }

            h1 {
                font-size: 24px;
            }

            #question {
                font-size: 20px;
            }

            button {
                padding: 13px 24px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="container" id="quiz">

    <div class="heart">❤️</div>

    <h1>یه سوال مهم ازت دارم...</h1>

    <div id="question">
        منو دوست داری؟ 🥺❤️
    </div>

    <div class="buttons">
        <button id="yesBtn" onclick="yesClicked()">
            آره ❤️
        </button>

        <button id="noBtn" onclick="noClicked()">
            نه 😐
        </button>
    </div>

    <div id="message"></div>

</div>


<div class="container final" id="final">

    <div class="final-heart">💖</div>

    <h1>می‌دونستم! 😍</h1>

    <p>
        بالاخره اعتراف کردی که دوستم داری ❤️
        <br>
        منم خیلی دوستت دارم 🥰
        <br>
        <br>
        پایان این داستان:
        <br>
        <strong>دو تا آدم عاشق ❤️</strong>
    </p>

</div>


<script>

    let noCount = 0;
    let yesSize = 19;

    const questions = [
        "منو دوست داری؟ 🥺❤️",
        "واقعا دوستم داری؟ 😏❤️",
        "یعنی من برات خاصم؟ 🥰",
        "دوست داری همیشه کنار هم باشیم؟ ❤️",
        "پس قبول داری که منو خیلی دوست داری؟ 😌❤️"
    ];

    let questionIndex = 0;

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const question = document.getElementById("question");
    const message = document.getElementById("message");

    function noClicked() {

        noCount++;

        // بزرگ شدن دکمه آره
        yesSize += 7;

        yesBtn.style.fontSize = yesSize + "px";
        yesBtn.style.padding =
            (15 + noCount * 2) + "px " +
            (30 + noCount * 4) + "px";

        // پیام‌های بامزه
        const messages = [
            "مطمئنی؟ 😳",
            "دوباره فکر کن 😂",
            "اشتباه زدی! 😭",
            "نه دیگه قبول نیست 😅",
            "آره رو امتحان کن ❤️",
            "داری دکمه آره رو بزرگ‌تر می‌کنی 😂",
            "آخرش مجبور میشی آره بزنی 😎❤️"
        ];

        message.innerText =
            messages[Math.min(noCount - 1, messages.length - 1)];

        // جابه‌جایی دکمه نه
        const x = Math.floor(Math.random() * 180) - 90;
        const y = Math.floor(Math.random() * 120) - 60;

        noBtn.style.transform =
            `translate(${x}px, ${y}px)`;

        // بعد از چند بار نه، سؤال تغییر کند
        if (noCount % 3 === 0 && questionIndex < questions.length - 1) {

            questionIndex++;

            question.innerText =
                questions[questionIndex];
        }

        createHeart();
    }


    function yesClicked() {

        if (questionIndex < questions.length - 1) {

            questionIndex++;

            question.innerText =
                questions[questionIndex];

            message.innerText =
                "آخ جون 😍❤️";

            // کمی ریست برای سؤال بعد
            noCount = 0;
            yesSize = 19;

            yesBtn.style.fontSize = "19px";
            yesBtn.style.padding = "15px 30px";

            noBtn.style.transform = "translate(0,0)";

        } else {

            document.getElementById("quiz").style.display = "none";

            document.getElementById("final").style.display = "block";

            for(let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 100);
            }
        }
    }


    function createHeart() {

        const heart = document.createElement("div");

        heart.classList.add("floating-heart");

        const hearts = ["❤️", "💖", "💕", "💗", "💓"];

        heart.innerText =
            hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (3 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 7000);
    }


    // قلب‌های پس‌زمینه
    setInterval(createHeart, 900);

</script>

</body>
</html>
```
